[build]
  publish = "."
  functions = "netlify/functions"

# URL limpia para la app: /app sirve el contenido de /app.html
# (la landing vive en la raiz "/" = index.html).
[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

# URL limpia para la pagina de enlaces (linktree): /links sirve /links.html
[[redirects]]
  from = "/links"
  to = "/links.html"
  status = 200

# Compatibilidad hacia atras: cualquiera que tuviera guardado el link
# viejo de la landing (/landing o /landing.html) va a la raiz.
[[redirects]]
  from = "/landing.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/landing"
  to = "/"
  status = 301
