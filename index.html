                                <p className="text-[10px] text-gray-400 mt-1 font-medium">Muestra tu huella verde en Instagram o WhatsApp</p>
                            </div>
                        </div>
                        <svg className="w-5 h-5 text-purple-400 group-hover:translate-x-1 transition-transform relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M13 7l5 5m0 0l-5 5m5-5H6" /></svg>
                    </button>
                </div>
            );
        };

        const Tracker = ({ user, onUpdateUser, onConfetti }) => {
            const [mode, setMode] = useState('bike');
            const [distance, setDistance] = useState(5);
            const [isTracking, setIsTracking] = useState(false);
            const [trackMode, setTrackMode] = useState('manual'); // 'manual' | 'gps'
            const [gpsStatus, setGpsStatus] = useState('idle'); // idle | acquiring | active | error
            const [gpsDistance, setGpsDistance] = useState(0); // km reales acumulados por GPS
            const [elapsedSec, setElapsedSec] = useState(0);
            const watchIdRef = React.useRef(null);
            const lastPosRef = React.useRef(null);
            const startTimeRef = React.useRef(null);
            const timerRef = React.useRef(null);

            const co2Factors = {
                walk: 0.18, // saved vs car per km
                bike: 0.21,
                transport: 0.12,
                car: 0
            };

            // En modo GPS usamos la distancia real medida; en manual, el slider.
            const activeDistance = trackMode === 'gps' ? gpsDistance : distance;
            const savings = (activeDistance * co2Factors[mode]).toFixed(2);
            const coins = Math.round(activeDistance * 10); // 10 Beatcoins por cada KM real
            // Velocidad real: distancia real / tiempo real transcurrido (evita
            // la formula inventada anterior que solo multiplicaba la distancia).
            const realSpeedKmh = elapsedSec > 0 ? (gpsDistance / (elapsedSec / 3600)) : 0;

            // Distancia minima entre lecturas de GPS para contarla como
            // movimiento real (filtra el "ruido" tipico del GPS cuando la
            // persona esta quieta, que puede saltar algunos metros solo).
            const MIN_MOVEMENT_KM = 0.008; // 8 metros
            const MAX_JUMP_KM = 0.5; // descarta saltos irreales (perdida de señal)

            const stopGpsWatch = () => {
                if (watchIdRef.current !== null) {
                    navigator.geolocation.clearWatch(watchIdRef.current);
                    watchIdRef.current = null;
                }
                if (timerRef.current) {
                    clearInterval(timerRef.current);
                    timerRef.current = null;
                }
            };

            useEffect(() => stopGpsWatch, []);

            const startGpsTracking = () => {
                if (!('geolocation' in navigator)) {
                    toast('Tu navegador no soporta GPS. Usa el registro manual.', 'error');
                    return;
                }
                setGpsStatus('acquiring');
                setGpsDistance(0);
                setElapsedSec(0);
                lastPosRef.current = null;
                startTimeRef.current = Date.now();

                watchIdRef.current = navigator.geolocation.watchPosition(
                    (pos) => {
                        const { latitude, longitude, accuracy } = pos.coords;
                        setGpsStatus('active');
                        // Ignora lecturas con muy baja precision (GPS interior, etc.)
                        if (accuracy && accuracy > 50) return;

                        if (lastPosRef.current) {
                            const delta = distanceKm(lastPosRef.current.lat, lastPosRef.current.lon, latitude, longitude);
                            if (delta >= MIN_MOVEMENT_KM && delta <= MAX_JUMP_KM) {
                                setGpsDistance(d => d + delta);
                                lastPosRef.current = { lat: latitude, lon: longitude };
                            } else if (delta > MAX_JUMP_KM) {
                                // Salto irreal (perdida de señal): solo actualiza el punto de referencia, no suma distancia
                                lastPosRef.current = { lat: latitude, lon: longitude };
                            }
                        } else {
                            lastPosRef.current = { lat: latitude, lon: longitude };
                        }
                    },
                    (err) => {
                        setGpsStatus('error');
                        toast('No se pudo acceder al GPS. Revisa los permisos de ubicación.', 'error');
                    },
                    { enableHighAccuracy: true, maximumAge: 3000, timeout: 15000 }
                );

                timerRef.current = setInterval(() => {
                    setElapsedSec(Math.round((Date.now() - startTimeRef.current) / 1000));
                }, 1000);
            };

            const formatElapsed = (sec) => {
                const m = Math.floor(sec / 60).toString().padStart(2, '0');
                const s = (sec % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };

            const handleComplete = () => {
                stopGpsWatch();
                const finalDistance = parseFloat(activeDistance.toFixed(2));
                if (trackMode === 'gps' && finalDistance < 0.05) {
                    toast('No se detectó movimiento suficiente. Actividad no guardada.', 'error');
                    setIsTracking(false);
                    setGpsStatus('idle');
                    return;
                }
                const activity = {
                    date: new Date().toLocaleDateString(),
                    mode,
                    distance: finalDistance,
                    savings: parseFloat(savings),
                    points: coins,
                    source: trackMode, // 'gps' (real) o 'manual' (declarado)
                    durationSec: trackMode === 'gps' ? elapsedSec : null,
                    id: Date.now()
                };
                const updatedUser = {
                    ...user,
                    points: (user.points || 0) + coins,
                    activities: [...(user.activities || []), activity]
                };
                DB.updateUser(updatedUser);
                onUpdateUser(updatedUser);
                if (onConfetti) onConfetti();
                const sourceLabel = trackMode === 'gps' ? '📍 GPS real' : '✍️ Manual';
                toast(`¡+${coins} Beatcoins! Ahorraste ${savings} kg de CO2 🌱 (${sourceLabel})`, 'coin');
                setIsTracking(false);
                setGpsStatus('idle');
                setGpsDistance(0);
                setElapsedSec(0);
            };

            return (
                <div className="animate-in slide-in-from-bottom duration-500 space-y-8 pb-32">
                    <div className="text-center px-4">
                        <h1 className="text-2xl font-black italic tracking-tighter uppercase lg:text-3xl">Eco <span className="text-mint-400">Tracker</span></h1>
                        <p className="text-gray-500 text-[10px] font-black uppercase tracking-widest mt-1">Sustentabilidad en Tiempo Real</p>
                    </div>

                    {/* Mode Selector */}
                    <div className="grid grid-cols-4 gap-2 px-1">
                        {[
                            { id: 'walk', icon: '🥾', label: 'Walk' },
                            { id: 'bike', icon: '🚲', label: 'Bike' },
                            { id: 'transport', icon: '🚌', label: 'Bus' },
                            { id: 'car', icon: '🚗', label: 'Car' }
                        ].map(m => (
                            <button
                                key={m.id}
                                onClick={() => setMode(m.id)}
                                className={`flex flex-col items-center py-2.5 rounded-2xl border transition-all duration-500 ${mode === m.id ? 'bg-mint-500/10 border-mint-500 shadow-[0_0_15px_rgba(17,212,66,0.2)]' : 'bg-white/5 border-white/5 opacity-40'}`}
                            >
                                <span className="text-xl mb-1">{m.icon}</span>
                                <span className="text-[8px] font-black uppercase tracking-widest">{m.label}</span>
                            </button>
                        ))}
                    </div>

                    {/* Selector de modo de registro: GPS real vs manual */}
                    {!isTracking && (
                        <div className="flex bg-white/5 rounded-2xl p-1 gap-1 mx-1">
                            <button onClick={() => setTrackMode('gps')} className={`flex-1 py-2.5 rounded-xl text-[11px] font-black transition-all ${trackMode === 'gps' ? 'bg-mint-500 text-forest-950' : 'text-gray-400 hover:text-white'}`}>📍 GPS Real</button>
                            <button onClick={() => setTrackMode('manual')} className={`flex-1 py-2.5 rounded-xl text-[11px] font-black transition-all ${trackMode === 'manual' ? 'bg-mint-500 text-forest-950' : 'text-gray-400 hover:text-white'}`}>✍️ Manual</button>
                        </div>
                    )}

                    {/* Speedometer UI */}
                    <div className="relative group">
                        <div className="absolute inset-0 bg-mint-500/5 blur-3xl rounded-full scale-75 animate-pulse"></div>
                        <div className="glass-card p-8 border-white/5 flex flex-col items-center justify-center space-y-6 relative overflow-hidden min-h-[380px]">
                            {/* Circular Progress (Back) */}
                            <svg className="absolute w-[280px] h-[280px] -rotate-90 opacity-20" viewBox="0 0 100 100">
                                <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" strokeWidth="2" strokeDasharray="283" className="text-gray-800" />
                            </svg>
                            {/* Circular Progress (Front) */}
                            <svg className="absolute w-[280px] h-[280px] -rotate-90" viewBox="0 0 100 100">
                                <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" strokeWidth="2.5" 
                                    strokeDasharray="283" 
                                    strokeDashoffset={283 - (Math.min(activeDistance, 50) / 50) * 283} 
                                    className={`transition-all duration-700 ease-out shadow-[0_0_10px_#11d442] ${trackMode === 'gps' && gpsStatus === 'active' ? 'text-mint-400 animate-pulse' : 'text-mint-500'}`}
                                    strokeLinecap="round"
                                />
                            </svg>

                            {/* Center Value */}
                            <div className="relative z-10 flex flex-col items-center">
                                <span className="text-gray-500 text-[10px] font-black uppercase tracking-[0.2em] mb-1">
                                    {trackMode === 'gps' ? (gpsStatus === 'active' ? '📍 Distancia Real' : gpsStatus === 'acquiring' ? 'Buscando señal GPS...' : 'Distancia Real') : 'Distancia'}
                                </span>
                                <div className="text-7xl font-black text-white italic tracking-tighter flex items-baseline">
                                    {activeDistance.toFixed(trackMode === 'gps' ? 2 : 1)}
                                    <span className="text-sm font-bold text-mint-400 ml-1 not-italic">KM</span>
                                </div>
                                <div className="mt-4 flex flex-col items-center">
                                    <div className="flex items-center space-x-2 bg-mint-500/10 border border-mint-500/20 px-3 py-1 rounded-full">
                                        <span className="text-[10px] font-black text-mint-400">-{savings}kg CO2</span>
                                    </div>
                                </div>
                            </div>

                            {/* Speed/Pace Grid */}
                            <div className="absolute bottom-10 inset-x-8 grid grid-cols-2 gap-4 border-t border-white/5 pt-6">
                                <div className="text-center">
                                    <p className="text-[8px] text-gray-500 font-black uppercase tracking-widest">{trackMode === 'gps' ? 'Tiempo / Vel. Real' : 'Vel. Estimada'}</p>
                                    {trackMode === 'gps' ? (
                                        <p className="text-lg font-black text-white italic">{formatElapsed(elapsedSec)} <span className="text-[10px] not-italic text-gray-400">· {realSpeedKmh.toFixed(1)} km/h</span></p>
                                    ) : (
                                        <p className="text-lg font-black text-white italic">{(distance * 1.5).toFixed(1)} <span className="text-[10px] not-italic text-gray-400">km/h</span></p>
                                    )}
                                </div>
                                <div className="text-center">
                                    <p className="text-[8px] text-gray-500 font-black uppercase tracking-widest">Beatcoins</p>
                                    <p className="text-lg font-black text-beatcoin italic">+{coins} <span className="text-sm">🪙</span></p>
                                </div>
                            </div>
                            
                            {/* Cyberpunk Grid/Lines Overlay */}
                            <div className="absolute inset-0 pointer-events-none opacity-[0.03]" style={{backgroundImage: 'linear-gradient(rgba(17,212,66,0.5) 1px, transparent 1px), linear-gradient(90deg, rgba(17,212,66,0.5) 1px, transparent 1px)', backgroundSize: '20px 20px'}}></div>
                        </div>
                    </div>

                    {trackMode === 'manual' && !isTracking && (
                        <div className="px-4 space-y-3">
                            <div className="flex justify-between items-center text-[9px] font-black text-gray-500 uppercase tracking-widest px-1">
                                <span>Mín: 1km</span>
                                <span className="text-mint-400">Ajuste manual de sesión</span>
                                <span>Máx: 50km</span>
                            </div>
                            <input
                                type="range"
                                min="1"
                                max="50"
                                step="0.5"
                                value={distance}
                                onChange={(e) => setDistance(parseFloat(e.target.value))}
                                className="w-full h-1.5 bg-white/5 rounded-full appearance-none cursor-pointer accent-mint-500"
                            />
                            <p className="text-[9px] text-gray-500 text-center px-4">Registro manual: declaras tú mismo la distancia. Para una medición real, usa el modo 📍 GPS Real.</p>
                        </div>
                    )}

                    {trackMode === 'gps' && (
                        <div className="px-4">
                            {gpsStatus === 'error' && (
                                <p className="text-[10px] text-red-400 text-center">No se pudo acceder al GPS. Revisa los permisos de ubicación del navegador.</p>
                            )}
                            {!isTracking && gpsStatus !== 'error' && (
                                <p className="text-[9px] text-gray-500 text-center">Se medirá tu distancia real usando el GPS del dispositivo mientras te mueves.</p>
                            )}
                        </div>
                    )}

                    <div className="px-4 relative">
                        {isTracking && trackMode === 'manual' && (
                            <div className="absolute -top-12 left-1/2 -translate-x-1/2 w-48 text-center animate-in slide-in-from-bottom duration-500">
                                <div className="bg-mint-500 text-forest-950 text-[10px] font-black py-1 px-3 rounded-full shadow-lg inline-flex items-center space-x-2 border-2 border-forest-950">
                                    <span className="w-2 h-2 bg-forest-950 rounded-full animate-ping"></span>
                                    <span>"¡Gran ritmo, sigue así!"</span>
                                </div>
                                <div className="w-2 h-2 bg-mint-500 rotate-45 mx-auto -mt-1 border-r-2 border-b-2 border-forest-950"></div>
                            </div>
                        )}
                        <button
                            onClick={() => {
                                if (isTracking) {
                                    handleComplete();
                                } else {
                                    setIsTracking(true);
                                    if (trackMode === 'gps') {
                                        startGpsTracking();
                                    } else if ('speechSynthesis' in window) {
                                        const ut = new SpeechSynthesisUtterance("¡Viaje iniciado! Vamos a limpiar la ciudad.");
                                        ut.lang = 'es-CL';
                                        ut.rate = 1.2;
                                        window.speechSynthesis.speak(ut);
                                    }
                                }
                            }}
                            className={`w-full py-5 rounded-[2rem] font-black text-lg uppercase tracking-widest transition-all duration-500 relative overflow-hidden group ${isTracking ? 'bg-red-500 shadow-[0_10px_30px_rgba(239,68,68,0.3)] text-white' : 'bg-mint-500 shadow-[0_10px_30px_rgba(17,212,66,0.3)] text-forest-950 hover:scale-[1.02]'}`}
                        >
                            <span className="relative z-10 flex items-center justify-center space-x-3">
                                {isTracking ? (
                                    <>
                                        <div className="w-3 h-3 bg-white rounded-full animate-ping"></div>
                                        <span>Detener Actividad</span>
                                    </>
                                ) : (
                                    <>
                                        <span>Comenzar Viaje</span>
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M13 7l5 5m0 0l-5 5m5-5H6" /></svg>
                                    </>
                                )}
                            </span>
                            <div className="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-500"></div>
                        </button>
                    </div>
                </div>
            );
        };

        const SyncHub = ({ user, onUpdateUser, setActiveTab }) => {
            const toast = useToast();
            const [activeSection, setActiveSection] = useState('devices');
            const [scanState, setScanState] = useState('idle'); // idle | starting | scanning | error
            const [connectedDevice, setConnectedDevice] = useState(user?.connectedDevice || null);
            const qrRegionId = 'qr-reader-region';
            const html5QrRef = React.useRef(null);

            // Detiene y libera la camara de forma segura (llamar siempre antes
            // de desmontar o cambiar de vista, para no dejar la camara prendida
            // en segundo plano).
            const stopScanner = () => {
                if (html5QrRef.current) {
                    html5QrRef.current.stop().catch(() => {}).finally(() => {
                        html5QrRef.current.clear();
                        html5QrRef.current = null;
                    });
                }
            };

            useEffect(() => stopScanner, []);

            const startQrScan = () => {
                if (typeof Html5Qrcode === 'undefined') {
                    toast('No se pudo cargar el escáner de cámara. Revisa tu conexión.', 'error');
                    return;
                }
                setScanState('starting');
                const html5QrCode = new Html5Qrcode(qrRegionId);
                html5QrRef.current = html5QrCode;

                html5QrCode.start(
                    { facingMode: 'environment' }, // camara trasera del celular
                    { fps: 10, qrbox: { width: 230, height: 230 } },
                    (decodedText) => {
                        // Codigo QR real detectado por la camara del dispositivo
                        stopScanner();
                        setScanState('idle');
                        const dev = { name: decodedText.slice(0, 40), source: 'qr', connectedAt: new Date().toISOString() };
                        setConnectedDevice(dev);
                        const updated = { ...user, connectedDevice: dev };
                        DB.updateUser(updated); onUpdateUser(updated);
                        toast('¡QR escaneado y conectado! 🚲', 'success');
                    },
                    () => { /* frame sin QR detectado: normal, se ignora */ }
                ).then(() => {
                    setScanState('scanning');
                }).catch((err) => {
                    console.error('No se pudo iniciar la cámara', err);
                    setScanState('error');
                    toast('No se pudo acceder a la cámara. Revisa los permisos del navegador.', 'error');
                });
            };

            const cancelQrScan = () => {
                stopScanner();
                setScanState('idle');
            };

            const disconnectDevice = () => {
                setConnectedDevice(null);
                const updated = { ...user, connectedDevice: null };
                DB.updateUser(updated); onUpdateUser(updated);
                toast('Dispositivo desconectado', 'info');
            };

            return (
                <div className="animate-in fade-in duration-500 space-y-5 pb-32">
                    <div className="px-2 flex items-center space-x-3">
                        {setActiveTab && (
                            <button onClick={() => { stopScanner(); setActiveTab('profile'); }} className="p-2 -ml-2 bg-white/5 hover:bg-white/10 rounded-xl transition-colors">
                                <svg className="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M15 19l-7-7 7-7" /></svg>
                            </button>
                        )}
                        <div>
                            <h1 className="text-2xl font-black">Sync <span className="text-mint-400">Hub</span></h1>
                            <p className="text-gray-400 text-sm mt-1">Conecta estaciones y bicicletas reales</p>
                        </div>
                    </div>

                    {connectedDevice && (
                        <div className="bg-mint-500/10 border border-mint-500/30 rounded-3xl p-4 flex items-center justify-between animate-in slide-in-from-top duration-400">
                            <div className="flex items-center space-x-3">
                                <div className="w-10 h-10 bg-mint-500/20 rounded-2xl flex items-center justify-center text-xl">🚲</div>
                                <div>
                                    <p className="text-[10px] text-mint-400 font-black uppercase tracking-widest">Estación activa</p>
                                    <p className="font-bold text-white text-sm break-all">{connectedDevice.name}</p>
                                </div>
                            </div>
                            <button onClick={disconnectDevice} className="text-red-400 text-[10px] font-black uppercase tracking-wider bg-red-500/10 px-3 py-1.5 rounded-xl hover:text-red-300 transition-colors flex-shrink-0">Desconectar</button>
                        </div>
                    )}

                    <div className="flex bg-white/5 rounded-2xl p-1 gap-1">
                        {[{ id: 'devices', label: '📷 Escanear QR' }, { id: 'identity', label: '🆔 Identidad' }].map(tab => (
                            <button key={tab.id} onClick={() => { stopScanner(); setScanState('idle'); setActiveSection(tab.id); }}
                                className={`flex-1 py-2 rounded-xl text-[11px] font-black transition-all ${activeSection === tab.id ? 'bg-mint-500 text-forest-950' : 'text-gray-400 hover:text-white'}`}>
                                {tab.label}
                            </button>
                        ))}
                    </div>

                    {activeSection === 'devices' && (
                        <div className="space-y-5 animate-in fade-in duration-300">
                            <div className="glass-card p-6 text-center space-y-5">
                                <div className="flex items-center justify-between">
                                    <h3 className="font-black text-base">Escanear Código QR</h3>
                                    {scanState === 'scanning' && (
                                        <button onClick={cancelQrScan} className="text-gray-500 text-[10px] uppercase hover:text-white transition-colors">✕ Cerrar cámara</button>
                                    )}
                                </div>

                                {scanState === 'idle' || scanState === 'error' ? (
                                    <>
                                        <div className="w-20 h-20 mx-auto bg-mint-500/20 rounded-full flex items-center justify-center border-2 border-mint-500/30">
                                            <svg className="w-9 h-9 text-mint-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
                                            </svg>
                                        </div>
                                        <p className="text-xs text-gray-400">Usa la cámara real de tu celular para escanear el QR de una <span className="text-mint-400 font-bold">estación HappyBeat</span> o <span className="text-mint-400 font-bold">bicicleta</span> física.</p>
                                        {scanState === 'error' && (
                                            <p className="text-[10px] text-red-400">No se pudo acceder a la cámara. Verifica los permisos del navegador e intenta de nuevo.</p>
                                        )}
                                        <button onClick={startQrScan} className="btn-primary w-full">📷 Activar Cámara</button>
                                    </>
                                ) : (
                                    <div className="space-y-3">
                                        <div id={qrRegionId} className="w-full rounded-2xl overflow-hidden border-2 border-mint-500/30 bg-black min-h-[250px] flex items-center justify-center">
                                            {scanState === 'starting' && <p className="text-xs text-gray-500">Solicitando acceso a la cámara...</p>}
                                        </div>
                                        {scanState === 'scanning' && (
                                            <div className="flex items-center justify-center space-x-2 text-[10px] text-gray-500">
                                                <div className="w-2 h-2 bg-mint-500 rounded-full animate-pulse"></div>
                                                <span>Apunta la cámara al código QR...</span>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>

                            <div className="bg-beatcoin/5 border border-beatcoin/20 rounded-2xl p-4 flex items-start space-x-3">
                                <span className="text-lg mt-0.5">🗺️</span>
                                <div>
                                    <p className="text-[11px] text-beatcoin font-bold">Próximamente: wearables y apps de salud</p>
                                    <p className="text-[10px] text-gray-400 mt-0.5 leading-relaxed">La conexión directa con relojes inteligentes (Apple Watch, Garmin, etc.) y apps como Strava o Google Fit requiere un backend propio para manejar sus credenciales de forma segura, y está planificada para una futura versión. Mientras tanto, registra tus actividades manualmente desde <span className="text-mint-400 font-bold">Track</span>, o usa el escáner QR de arriba para conectar estaciones y bicicletas físicas reales de Happy Beat.</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {activeSection === 'identity' && (
                        <div className="space-y-4 animate-in fade-in duration-300">

            };

            const handleDataChange = (field, value) => {
                const newData = { ...data, [field]: value };
                setData(newData);
                const updatedUser = {
                    ...user,
                    businessData: {
                        ...user?.businessData,
                        data: newData,
                        certified: false // Re-verify if data changes
                    }
                };
                
                onUpdateUser(updatedUser);
                
                // Debounce Firestore backend sync
                if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
                saveTimeoutRef.current = setTimeout(() => {
                    DB.updateUser(updatedUser);
                }, 1500);
            };

            const totalCO2 = (data.energy * 0.45 + data.fleet * 2.3 + data.waste * 0.15).toFixed(2);

            return (
                <div className="animate-in fade-in duration-500 space-y-6 pb-32 px-1">
                    {/* Header */}
                    <div className="flex justify-between items-start">
                        <div>
                            <h1 className="text-2xl font-black text-white tracking-tight">Portal Pro para Empresas</h1>
                            <p className="text-gray-400 text-xs font-medium">Emisiones bajo GHG Protocol</p>
                        </div>
                        <span className="bg-blue-500/10 text-blue-400 text-[10px] font-black px-2 py-0.5 rounded border border-blue-500/20 uppercase tracking-tighter">Internacional</span>
                    </div>

                    {/* Summary Cards */}
                    <div className="grid grid-cols-2 gap-4">
                        <div className="glass-card p-4 border-l-4 border-blue-500 flex flex-col justify-between h-28">
                            <span className="text-[10px] text-gray-500 uppercase font-black tracking-widest">Total CO2 Mitigado</span>
                            <div>
                                <div className="text-2xl font-black text-white">{(Number(totalCO2) / 1).toFixed(0)} <span className="text-xs text-blue-400">kg</span></div>
                                <span className="text-[8px] text-blue-400/60 font-bold uppercase mt-1 block">Metodología WRI/WBCSD</span>
                            </div>
                        </div>
                        <div className="glass-card p-4 border-l-4 border-mint-500 flex flex-col justify-between h-28">
                            <span className="text-[10px] text-gray-500 uppercase font-black tracking-widest">Estado</span>
                            <div>
                                <div className={`text-sm font-black ${certified ? 'text-mint-400' : 'text-beatcoin animate-pulse'}`}>
                                    {certified ? '✓ CERTIFICADO' : 'PENDIENTE'}
                                </div>
                                <span className="text-[8px] text-gray-500 font-bold uppercase mt-1 block italic text-mint-500/60">Auditoría Anual 2026</span>
                            </div>
                        </div>
                    </div>

                    {/* Data Entry Form */}
                    <div className="glass-card p-6 space-y-6">
                        <h3 className="text-xs font-black uppercase tracking-[0.2em] text-mint-400 border-b border-white/5 pb-3">Ingreso de Datos de Ahorro</h3>

                        <div className="space-y-5">
                            <div>
                                <label className="text-[10px] font-bold block mb-2 px-1">
                                    <span className="text-blue-400 mr-2 uppercase">[Alcance 2]</span> Energía Eléctrica (kWh)
                                </label>
                                <input
                                    type="number"
                                    value={data.energy}
                                    onChange={(e) => handleDataChange('energy', Number(e.target.value))}
                                    className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 focus:border-blue-500 outline-none transition-all text-sm font-bold"
                                    placeholder="Ej: 1200"
                                />
                            </div>
                            <div>
                                <label className="text-[10px] font-bold block mb-2 px-1">
                                    <span className="text-orange-400 mr-2 uppercase">[Alcance 1]</span> Combustión Fija/Móvil (Km o Litros)
                                </label>
                                <input
                                    type="number"
                                    value={data.fleet}
                                    onChange={(e) => handleDataChange('fleet', Number(e.target.value))}
                                    className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 focus:border-orange-500 outline-none transition-all text-sm font-bold"
                                    placeholder="Ej: 450"
                                />
                            </div>
                            <div>
                                <label className="text-[10px] font-bold block mb-2 px-1">
                                    <span className="text-purple-400 mr-2 uppercase">[Alcance 3]</span> Otras Emisiones Indirectas (kg CO2)
                                </label>
                                <input
                                    type="number"
                                    value={data.waste}
                                    onChange={(e) => handleDataChange('waste', Number(e.target.value))}
                                    className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 focus:border-purple-500 outline-none transition-all text-sm font-bold"
                                    placeholder="Ej: 300"
                                />
                            </div>
                        </div>

                        {/* Verification */}
                        <div className="pt-4 space-y-4">
                            <h4 className="text-[10px] font-black text-gray-400 uppercase tracking-widest px-1">Método de Verificación</h4>
                            <label className="p-4 bg-white/5 border border-dashed border-white/20 rounded-2xl flex items-center space-x-4 cursor-pointer hover:bg-white/10 transition-all group relative">
                                <input
                                    id="business-file-upload"
                                    type="file"
                                    className="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-10"
                                    onChange={(e) => handleVerify(e.target.files[0])}
                                    disabled={isVerifying || certified}
                                    title="Sube tu factura o certificado"
                                />
                                <div className="w-10 h-10 bg-mint-500/10 rounded-xl flex items-center justify-center text-mint-500 group-hover:scale-110 transition-transform">
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" /></svg>
                                </div>
                                <div>
                                    <p className="text-xs font-black text-white">{user?.businessData?.fileName || 'Subir Factura/Certificado'}</p>
                                    <p className="text-[9px] text-gray-500 uppercase font-bold">PDF, JPG o PNG (Máx 10MB)</p>
                                </div>
                            </label>

                            <button
                                onClick={() => document.getElementById('business-file-upload')?.click()}
                                disabled={isVerifying || certified}
                                className={`w-full py-4 rounded-2xl font-black text-xs uppercase tracking-[0.2em] transition-all duration-300 ${certified ? 'bg-mint-500/20 text-mint-400 border border-mint-500/30' : 'bg-mint-500 text-forest-950 shadow-[0_0_30px_rgba(17,212,66,0.3)] hover:scale-[1.02] active:scale-95'}`}
                            >
                                {isVerifying ? (
                                    <span className="flex items-center justify-center space-x-2">
                                        <div className="w-3 h-3 border-2 border-forest-950/30 border-t-forest-950 rounded-full animate-spin"></div>
                                        <span>Analizando Evidencia...</span>
                                    </span>
                                ) : certified ? 'EMISIONES CERTIFICADAS ✓' : 'ADJUNTAR Y CERTIFICAR'}
                            </button>

                            {certified && (
                                <div className="space-y-3 animate-in fade-in zoom-in duration-500">
                                    <a
                                        href="https://link.mercadopago.cl/happybeatcl"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        onClick={() => {
                                            setTimeout(() => {
                                                const btn = document.getElementById('downloadCertBtn');
                                                if (btn) btn.style.display = 'flex';
                                            }, 2000);
                                        }}
                                        className="w-full py-5 rounded-3xl font-black text-xs uppercase tracking-[0.2em] bg-gradient-to-r from-blue-700 to-blue-500 text-white shadow-[0_10px_40px_rgba(37,99,235,0.4)] hover:scale-[1.03] active:scale-95 transition-all text-center flex items-center justify-center space-x-3 border border-blue-400/30"
                                    >
                                        <span className="text-xl">💎</span>
                                        <span>ACTIVAR AUDITORÍA Y DESCARGA OFICIAL</span>
                                    </a>

                                    <button
                                        id="downloadCertBtn"
                                        onClick={downloadCertificate}
                                        style={{ display: 'none' }}
                                        className="w-full py-5 rounded-3xl font-black text-sm uppercase tracking-[0.2em] bg-mint-500 text-forest-950 hover:bg-white transition-all text-center flex items-center justify-center space-x-3 animate-bounce shadow-[0_0_30px_rgba(17,212,66,0.5)]"
                                    >
                                        <span className="text-xl">🏆</span>
                                        <span>OBTENER CERTIFICADO PDF PRO</span>
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Compliance Section */}
                    <div className="glass-card p-6 bg-blue-500/5 border-blue-500/20 flex space-x-4 items-center">
                        <div className="w-12 h-12 bg-blue-500/20 rounded-2xl flex items-center justify-center text-blue-400">
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
                        </div>
                        <div className="space-y-1">
                            <h4 className="text-[10px] font-black text-white uppercase tracking-widest">Cumplimiento Global</h4>
                            <p className="text-[10px] text-gray-400 leading-relaxed">
                                Nuestras métricas están alineadas con el <span className="text-blue-400 font-bold">GHG Protocol</span> (WRI/WBCSD), asegurando validez internacional en reportes ESG.
                            </p>
                        </div>
                    </div>

                    {/* Certificate Preview (Only if certified) */}
                    {certified && (
                        <div className="animate-in zoom-in duration-500">
                            <div className="glass-card p-1 overflow-hidden">
                                <div className="bg-gradient-to-br from-forest-900 to-forest-950 p-8 text-center space-y-4 border border-mint-500/20 rounded-[22px] relative">
                                    <div className="w-16 h-16 bg-mint-500/10 rounded-full flex items-center justify-center mx-auto border-2 border-mint-500 shadow-[0_0_30px_rgba(17,212,66,0.3)]">
                                        <span className="text-3xl">🌱</span>
                                    </div>
                                    <div className="space-y-1">
                                        <h4 className="text-white font-black uppercase text-base tracking-tighter italic">Certificado Happy Beat</h4>
                                        <p className="text-mint-400 text-[8px] font-black uppercase tracking-widest">Protocolo GHG Estándar Corporativo</p>
                                    </div>
                                    <div className="py-4 border-y border-white/5">
                                        <p className="text-gray-500 text-[8px] uppercase font-black mb-1">Empresa Beneficiaria:</p>
                                        <p className="text-white font-black text-xs uppercase tracking-tight">{user?.companyProfile?.companyName || user?.name || 'EMPRESA PARTNER'}</p>
                                    </div>
                                    <div className="flex justify-between items-end opacity-60">
                                        <div className="text-left text-[8px]">
                                            <p className="text-gray-500 uppercase font-black">ID Certificado</p>
                                            <p className="font-mono text-white">HB-2026-DX-99</p>
                                        </div>
                                        <div className="w-10 h-10 bg-white rounded-md p-1">
                                            <div className="w-full h-full bg-black flex items-center justify-center text-[8px] font-bold">QR</div>
                                        </div>
                                    </div>
                                </div>
                                <button onClick={downloadCertificate} className="w-full py-3 bg-white/5 hover:bg-white/10 text-white text-[9px] font-black uppercase tracking-widest transition-all">Descargar PDF Oficial</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const UserContext = React.createContext();

        const App = () => {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('home');
            const [showWelcome, setShowWelcome] = useState(false);
            const [confetti, setConfetti] = useState(false);

            const fireConfetti = () => {
                setConfetti(true);
                setTimeout(() => setConfetti(false), 3000);
            };

            const handleLogin = async (userData) => {
                let finalUser = userData;

                // Sync with Firestore
                try {
                    const doc = await db.collection('users').doc(userData.email).get();
                    if (doc.exists) {
                        finalUser = { ...userData, ...doc.data() };
                        // Update local storage with fresh data from firestore
                        const users = DB.getUsers().map(u => u.email === finalUser.email ? finalUser : u);
                        localStorage.setItem('hb_users', JSON.stringify(users));
                    } else {
                        // First time sync to firestore
                        await db.collection('users').doc(userData.email).set(userData);
                    }
                } catch (e) {
                    console.error('Firestore sync failed on login', e);
                }

                const isNew = !DB.getUsers().find(u => u.id === userData.id && (u.activities || []).length > 0);
                setUser(finalUser);

                if (finalUser.role === 'admin') setActiveTab('admin');
                else if (finalUser.role === 'business') setActiveTab('business');
                else setActiveTab('social'); // Redirecting to Social by default to encourage interaction

                if (isNew && finalUser.role === 'user') setShowWelcome(true);
            };

            const handleLogout = () => { setUser(null); setActiveTab('home'); };

            if (!user) {
                return <ToastProvider><Login onLogin={handleLogin} /></ToastProvider>;
            }

            return (
                <ToastProvider>
                    <UserContext.Provider value={user}>
                        <Confetti active={confetti} />

                        {/* Welcome Onboarding Modal */}
                        {showWelcome && (
                            <div className="fixed inset-0 z-[80] flex items-center justify-center p-6 bg-black/60 backdrop-blur-sm animate-in fade-in duration-300">
                                <div className="glass-card p-8 max-w-xs w-full text-center space-y-5 animate-in zoom-in duration-500 border-mint-500/30">
                                    <div className="w-20 h-20 mx-auto bg-mint-500/20 rounded-full flex items-center justify-center text-4xl border-2 border-mint-500/40 shadow-[0_0_30px_rgba(17,212,66,0.3)]">🎉</div>
                                    <div>
                                        <h2 className="text-2xl font-black">¡Bienvenido, <span className="text-mint-400">{user.name?.split(' ')[0]}!</span></h2>
                                        <p className="text-gray-400 text-sm mt-2">Tu cuenta fue creada. Como regalo de bienvenida tienes:</p>
                                    </div>
                                    <div className="bg-beatcoin/10 border border-beatcoin/30 rounded-2xl p-4 flex items-center justify-center space-x-3">
                                        <span className="text-4xl">🪙</span>
                                        <div className="text-left">
                                            <div className="text-3xl font-black text-beatcoin">100</div>
                                            <div className="text-xs text-gray-400 font-bold uppercase tracking-widest">Beatcoins de regalo</div>
                                        </div>
                                    </div>
                                    <button onClick={() => setShowWelcome(false)} className="btn-primary w-full">¡Empezar a Explorar! 🚀</button>
                                </div>
                            </div>
                        )}

                        <div className="max-w-md mx-auto px-6 pt-12 min-h-screen relative">
                            <div className="fixed top-0 left-0 w-full h-full pointer-events-none -z-10 bg-forest-950">
                                <div className="absolute top-[-10%] right-[-10%] w-96 h-96 bg-mint-500/10 rounded-full blur-[120px]"></div>
                                <div className="absolute bottom-[-10%] left-[-10%] w-96 h-96 bg-beatcoin/5 rounded-full blur-[120px]"></div>
                            </div>

                            {activeTab === 'home' && <Dashboard setActiveTab={setActiveTab} />}
                            {activeTab === 'map' && <EcoMap user={user} />}
                            {activeTab === 'track' && <Tracker user={user} onUpdateUser={setUser} onConfetti={fireConfetti} />}
                            {activeTab === 'sync' && <SyncHub user={user} onUpdateUser={setUser} setActiveTab={setActiveTab} />}
                            {activeTab === 'rewards' && <Rewards user={user} onUpdateUser={setUser} />}
                            {activeTab === 'company' && <CompanyProfile user={user} onUpdateUser={setUser} setActiveTab={setActiveTab} />}
                            {activeTab === 'business' && <BusinessPortal user={user} onUpdateUser={setUser} />}
                            {activeTab === 'social' && <SocialFeed user={user} />}
                            {activeTab === 'challenges' && <Community user={user} onUpdateUser={setUser} setActiveTab={setActiveTab} />}
                            {activeTab === 'admin' && <AdminPanel />}
                            {activeTab === 'profile' && <Profile user={user} onUpdateUser={setUser} onLogout={handleLogout} setActiveTab={setActiveTab} />}

                            {/* Bottom Navigation */}
                            <div className="fixed bottom-8 left-1/2 -translate-x-1/2 w-[98%] max-w-[420px] px-2 py-3.5 glass-morphism rounded-3xl flex justify-between items-center z-50 shadow-2xl">
                                <NavButton active={activeTab === 'home'} onClick={() => setActiveTab('home')} label="Inicio" icon={<svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>} />
                                <NavButton active={activeTab === 'map'} onClick={() => setActiveTab('map')} label="Mapa" icon={<svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" /></svg>} />
                                <NavButton active={activeTab === 'track'} onClick={() => setActiveTab('track')} label="Track" icon={<svg className="w-8 h-8 text-forest-950 bg-mint-500 rounded-full p-1.5 -mt-8 shadow-[0_0_20px_rgba(17,212,66,0.6)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M12 4v16m8-8H4" /></svg>} />
                                <NavButton active={activeTab === 'social'} onClick={() => setActiveTab('social')} label="Comunidad" icon={<svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>} />

                                {user.role === 'business' && (
                                    <NavButton active={activeTab === 'business'} onClick={() => setActiveTab('business')} label="Empresas" icon={<svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" /></svg>} />
                                )}

                                <NavButton active={activeTab === 'profile'} onClick={() => setActiveTab('profile')} label="Perfil" icon={
                                    <div className="relative">
                                        <img src={user?.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${user?.name || 'Felix'}`} className={`w-6 h-6 rounded-full object-cover border-2 transition-colors ${activeTab === 'profile' ? 'border-mint-400' : 'border-white/20'}`} alt="avatar" />
                                        {user?.isVerified && <div className="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 bg-blue-500 rounded-full border border-forest-950"></div>}
                                    </div>
                                } />
                                {user.role === 'admin' && (
                                    <NavButton active={activeTab === 'admin'} onClick={() => setActiveTab('admin')} label="Admin" icon={<svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>} />
                                )}
                            </div>
                        </div>
                    </UserContext.Provider>
                </ToastProvider>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
