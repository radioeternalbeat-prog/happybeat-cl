<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Beat CL - Ruta Cero | Rhythm for a Greener Tomorrow</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#11d442">
    <link rel="apple-touch-icon" href="/icon-192.png">
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Color+Emoji&display=swap"
        rel="stylesheet">
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --color-forest-950: #05140b;
            --color-forest-900: #0a2616;
            --color-forest-800: #123e24;
            --color-mint-400: #25f46a;
            --color-mint-500: #11d442;
            --color-beatcoin: #f4d125;
            
            --font-jakarta: 'Plus Jakarta Sans', 'Noto Color Emoji', sans-serif;
            
            --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        @layer base {
            body {
                @apply font-jakarta bg-forest-950 text-white min-h-screen overflow-x-hidden;
                background-image: radial-gradient(circle at top right, rgba(17, 212, 66, 0.1), transparent 40%),
                                  radial-gradient(circle at bottom left, rgba(244, 209, 37, 0.05), transparent 40%);
            }
        }

        @layer components {
            .glass-card {
                @apply bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl shadow-glass;
            }
            .glass-morphism {
                background: rgba(255, 255, 255, 0.03);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
            .btn-primary {
                @apply bg-mint-500 hover:bg-mint-400 text-forest-950 font-bold py-4 px-8 rounded-2xl transition-all duration-300 shadow-[0_0_20px_rgba(17,212,66,0.3)] active:scale-95;
            }
            .beatcoin-glow {
                @apply shadow-[0_0_15px_rgba(244,209,37,0.4)];
            }
        }

        @keyframes radar {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(2.5); opacity: 0; }
        }
        .animate-radar { animation: radar 2s infinite ease-out; }
        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }
        .animate-scan { animation: scan 3s infinite linear; }
        .animate-float { animation: float 4s ease-in-out infinite; }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity:1; }
            100% { transform: scale(2); opacity:0; }
        }
        @keyframes badge-unlock {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            60% { transform: scale(1.3) rotate(10deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .animate-badge-unlock { animation: badge-unlock 0.6s ease-out forwards; }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .animate-shimmer {
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.1) 50%, transparent 100%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }
        @keyframes glow-pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(59,130,246,0.3); }
            50% { box-shadow: 0 0 40px rgba(59,130,246,0.6), 0 0 60px rgba(59,130,246,0.2); }
        }
        .animate-glow-pulse { animation: glow-pulse 3s ease-in-out infinite; }
        @keyframes stamp {
            0% { transform: scale(3) rotate(-30deg); opacity: 0; }
            50% { transform: scale(1.1) rotate(-15deg); opacity: 1; }
            100% { transform: scale(1) rotate(-12deg); opacity: 1; }
        }
        .animate-stamp { animation: stamp 0.8s ease-out forwards; }
    </style>
</head>

<body>
    <div id="root"></div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(reg => {
                    console.log('SW registered!', reg);
                });
            });
        }
    </script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Escaner QR real (camara del dispositivo) -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Toast Notification System ---
        const ToastContext = React.createContext();
        let toastDispatch = null;
        const useToast = () => React.useContext(ToastContext);

        const ToastProvider = ({ children }) => {
            const [toasts, setToasts] = useState([]);
            const dispatch = (msg, type = 'success') => {
                const id = Date.now();
                setToasts(p => [...p, { id, msg, type }]);
                setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 3500);
            };
            toastDispatch = dispatch;
            const icons = { success: '✅', error: '❌', info: 'ℹ️', coin: '🪙' };
            const colors = { success: 'border-mint-500 bg-mint-500/10', error: 'border-red-500 bg-red-500/10', info: 'border-blue-400 bg-blue-400/10', coin: 'border-beatcoin bg-beatcoin/10' };
            return (
                <ToastContext.Provider value={dispatch}>
                    {children}
                    <div className="fixed top-6 right-4 left-4 z-[100] flex flex-col gap-2 pointer-events-none">
                        {toasts.map(t => (
                            <div key={t.id} className={`glass-card p-4 flex items-center space-x-3 border ${colors[t.type]} animate-in slide-in-from-top duration-300 shadow-2xl pointer-events-auto`}>
                                <span className="text-xl">{icons[t.type]}</span>
                                <span className="text-sm font-semibold text-white flex-1">{t.msg}</span>
                            </div>
                        ))}
                    </div>
                </ToastContext.Provider>
            );
        };
        const toast = (msg, type) => toastDispatch && toastDispatch(msg, type);

        // --- Confetti Animation ---
        const Confetti = ({ active }) => {
            if (!active) return null;
            const pieces = Array.from({ length: 28 }, (_, i) => i);
            const colors = ['#25f46a', '#f4d125', '#60a5fa', '#f472b6', '#a78bfa'];
            return (
                <div className="fixed inset-0 pointer-events-none z-[90] overflow-hidden">
                    {pieces.map(i => (
                        <div key={i} style={{
                            position: 'absolute', left: `${Math.random() * 100}%`,
                            top: '-10px', width: '10px', height: '10px',
                            backgroundColor: colors[i % colors.length],
                            borderRadius: i % 2 === 0 ? '50%' : '2px',
                            animation: `fall ${1.2 + Math.random() * 1.5}s ease-in forwards`,
                            animationDelay: `${Math.random() * 0.8}s`,
                            transform: `rotate(${Math.random() * 360}deg)`
                        }} />
                    ))}
                </div>
            );
        };

        // --- Mock Database Management ---
        // --- Firebase Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyDPBFvtSV2PITQC41ObFpWXv0C3df-gmd4",
            authDomain: "app-happybeat.firebaseapp.com",
            projectId: "app-happybeat",
            storageBucket: "app-happybeat.firebasestorage.app",
            messagingSenderId: "11149842884",
            appId: "1:11149842884:web:431dd2502cdb24c11bec91",
            measurementId: "G-G38C2ZW8J8"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Register Service Worker for PWA + Push Notifications
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
                try {
                    const reg = await navigator.serviceWorker.register('/sw.js');
                    console.log('SW registered!', reg);
                    // Request push notification permission
                    if ('Notification' in window && Notification.permission === 'default') {
                        setTimeout(() => {
                            Notification.requestPermission().then(perm => {
                                if (perm === 'granted') console.log('Push notifications enabled');
                            });
                        }, 5000); // Ask after 5 seconds
                    }
                } catch (err) {
                    console.log('SW reg failed', err);
                }
            });
        }

        // Local notification helper
        const sendLocalNotification = (title, body, icon = '/icon-192.png') => {
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(title, { body, icon, badge: '/icon-192.png' });
            }
        };

        // --- Mock Database Management (Now Bridge to Firebase) ---
        const DB = {
            getUsers: () => JSON.parse(localStorage.getItem('hb_users') || '[]'),
            saveUser: async (user) => {
                // For now keep local, but sync would happen here
                const users = DB.getUsers();
                const newUser = {
                    ...user,
                    id: Date.now(),
                    regDate: new Date().toLocaleDateString(),
                    points: 100,
                    redeemed: [],
                    activities: [],
                    isVerified: false
                };

                // Firestore Sync
                try {
                    await db.collection('users').doc(user.email).set(newUser);
                } catch (e) { console.error('Firestore save failed', e); }

                users.push(newUser);
                localStorage.setItem('hb_users', JSON.stringify(users));
                return newUser;
            },
            updateUser: async (updatedUser) => {
                const users = DB.getUsers().map(u => u.email === updatedUser.email ? updatedUser : u);
                localStorage.setItem('hb_users', JSON.stringify(users));

                // Firestore Sync
                try {
                    await db.collection('users').doc(updatedUser.email).update(updatedUser);
                } catch (e) { console.error('Firestore update failed', e); }

                return updatedUser;
            },
            deleteUser: async (id, email) => {
                const users = DB.getUsers().filter(u => u.id !== id);
                localStorage.setItem('hb_users', JSON.stringify(users));

                // Firestore Sync
                try {
                    if (email) await db.collection('users').doc(email).delete();
                } catch (e) { console.error('Firestore delete failed', e); }
            },
            validateUser: async (email, password) => {
                // Try Firebase Auth first for secure authentication
                try {
                    const cred = await auth.signInWithEmailAndPassword(email, password);
                    if (cred.user) {
                        // Check Firestore for role/profile data
                        const doc = await db.collection('users').doc(email).get();
                        if (doc.exists) return doc.data();
                    }
                } catch (fbErr) {
                    // Firebase auth failed, try local fallback for offline support
                    console.log('Firebase auth fallback to local', fbErr.code);
                }

                // Local fallback (offline support)
                const users = DB.getUsers();
                const user = users.find(u => u.email === email && u.password === password);
                return user;
            },
            getSettings: () => {
                const settings = JSON.parse(localStorage.getItem('hb_settings') || '{"streamUrl": "https://topradio.us/proxy/eternalbeat/stream", "donationUrl": "https://link.mercadopago.cl/happybeatcl"}');
                let dirty = false;
                // Force update if it's the old Argentina link or has a typo
                if (settings.donationUrl.includes('mercadopago.com.ar') || settings.donationUrl.includes('mercadopago.com')) {
                    settings.donationUrl = "https://link.mercadopago.cl/happybeatcl";
                    dirty = true;
                }
                // Migra a la señal real de audio: navegadores que guardaron el
                // viejo placeholder de YouTube quedan actualizados automaticamente.
                if (!settings.streamUrl || settings.streamUrl.includes('youtube.com')) {
                    settings.streamUrl = "https://topradio.us/proxy/eternalbeat/stream";
                    dirty = true;
                }
                if (dirty) localStorage.setItem('hb_settings', JSON.stringify(settings));
                return settings;
            },
            updateSettings: (settings) => {
                const current = DB.getSettings();
                localStorage.setItem('hb_settings', JSON.stringify({ ...current, ...settings }));
            }
        };

        // Removed hardcoded init

        // --- UI Components ---

        // Key de Geoapify (plan free) para el mapa estatico de Eco-Rutas.
        // Es una clave de uso publico/cliente (se usa directo en una URL de
        // imagen), no una credencial secreta de backend. Se recomienda
        // restringirla por dominio referente en el dashboard de Geoapify
        // (https://myprojects.geoapify.com) para evitar uso indebido desde
        // otros sitios.
        const GEOAPIFY_API_KEY = 'cc0f301e7ce548c0a439090892cb29e3';
        const SANTIAGO_COORDS = { lat: -33.456940, lon: -70.648270 };

        // Categorias reales de Geoapify Places API mapeadas a "recursos
        // amigables" del ecosistema Happy Beat CL. Referencia:
        // https://apidocs.geoapify.com/docs/places/
        const ECO_PLACE_TYPES = [
            { categories: 'service.recycling', icon: '♻️', label: 'Punto de Reciclaje', color: 'bg-blue-500/10', reward: '+50 B' },
            { categories: 'service.vehicle.charging_station', icon: '🔋', label: 'Estación Carga EV', color: 'bg-orange-500/10', reward: 'Partner' },
            { categories: 'rental.bicycle,parking.bicycles', icon: '🚲', label: 'Bicicletas / Parking', color: 'bg-mint-500/10', reward: '+0.5/km' },
        ];

        // Distancia en linea recta (formula haversine) entre dos puntos,
        // en kilometros. Se usa solo para mostrar "A X km de ti" en la UI.
        const distanceKm = (lat1, lon1, lat2, lon2) => {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        };

        // Ejemplos por defecto: se muestran solo si el GPS no esta activo,
        // o si la busqueda real no encuentra nada en la zona.
        const DEFAULT_NEARBY_POINTS = [
            { icon: '♻️', label: 'Punto Limpio Providencia', color: 'bg-blue-500/10', distanceLabel: 'A 1.2 km de ti', sub: 'Reciclaje Integral', reward: '+50 B' },
            { icon: '🚲', label: 'Ciclovía Río Mapocho', color: 'bg-mint-500/10', distanceLabel: 'A 0.5 km de ti', sub: 'Ruta Escénica', reward: '+0.5/km' },
            { icon: '🔋', label: 'Estación Carga EV', color: 'bg-orange-500/10', distanceLabel: 'A 3.4 km de ti', sub: 'Carga Rápida', reward: 'Partner' },
        ];

        const EcoMap = ({ user }) => {
            const [coords, setCoords] = useState(SANTIAGO_COORDS);
            const [gpsStatus, setGpsStatus] = useState('idle'); // idle | loading | active | error
            const [nearbyPoints, setNearbyPoints] = useState(null); // null = usar los de ejemplo
            const [loadingPoints, setLoadingPoints] = useState(false);
            const toast = useToast();

            const fetchNearbyPoints = async (lat, lon) => {
                setLoadingPoints(true);
                try {
                    const categories = ECO_PLACE_TYPES.map(t => t.categories).join(',');
                    const url = `https://api.geoapify.com/v2/places?categories=${categories}&filter=circle:${lon},${lat},3000&bias=proximity:${lon},${lat}&limit=15&apiKey=${GEOAPIFY_API_KEY}`;
                    const res = await fetch(url);
                    const data = await res.json();

                    const points = (data.features || []).map(f => {
                        const props = f.properties;
                        const cats = props.categories || [];
                        // Determinar a que "tipo amigable" pertenece este lugar
                        const type = ECO_PLACE_TYPES.find(t =>
                            t.categories.split(',').some(c => cats.includes(c))
                        ) || ECO_PLACE_TYPES[0];
                        const dist = distanceKm(lat, lon, props.lat, props.lon);
                        return {
                            icon: type.icon,
                            label: props.name || type.label,
                            color: type.color,
                            distanceLabel: `A ${dist.toFixed(1)} km de ti`,
                            sub: props.address_line2 || props.street || 'Chile',
                            reward: type.reward,
                            lat: props.lat,
                            lon: props.lon
                        };
                    }).sort((a, b) => parseFloat(a.distanceLabel.match(/[\d.]+/)) - parseFloat(b.distanceLabel.match(/[\d.]+/)));

                    setNearbyPoints(points.length > 0 ? points.slice(0, 8) : []);
                } catch (err) {
                    console.error('Error buscando puntos cercanos', err);
                    setNearbyPoints([]);
                } finally {
                    setLoadingPoints(false);
                }
            };

            const activateGPS = () => {
                if (!('geolocation' in navigator)) {
                    setGpsStatus('error');
                    toast('Tu navegador no soporta geolocalización.', 'error');
                    return;
                }
                setGpsStatus('loading');
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const newCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
                        setCoords(newCoords);
                        setGpsStatus('active');
                        toast('¡GPS activado! Buscando recursos cerca de ti...', 'success');
                        fetchNearbyPoints(newCoords.lat, newCoords.lon);
                    },
                    (err) => {
                        setGpsStatus('error');
                        toast('No se pudo obtener tu ubicación. Revisa los permisos.', 'error');
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            };

            const mapUrl = `https://maps.geoapify.com/v1/staticmap?style=dark-matter&width=600&height=400&center=lonlat:${coords.lon},${coords.lat}&zoom=13&marker=lonlat:${coords.lon},${coords.lat};color:%2311d442;size:large&apiKey=${GEOAPIFY_API_KEY}`;
            const displayedPoints = nearbyPoints !== null && nearbyPoints.length > 0 ? nearbyPoints : DEFAULT_NEARBY_POINTS;

            return (
            <div className="animate-in fade-in duration-500 space-y-6 pb-32">
                <div className="flex justify-between items-start">
                    <div>
                        <h2 className="text-3xl font-black text-white tracking-tight">Eco-<span className="text-mint-400">Rutas</span> 🗺️</h2>
                        <p className="text-gray-400 text-sm font-medium mt-1">Descubre puntos sostenibles cerca de ti.</p>
                    </div>
                </div>

                {/* Mapa en vivo (Geoapify) */}
                <div className="relative w-full h-64 rounded-[2rem] overflow-hidden border border-mint-500/30 shadow-[0_10px_40px_rgba(17,212,66,0.15)] bg-forest-900 flex items-center justify-center">
                    <div
                        className={`absolute inset-0 bg-cover bg-center transition-all duration-700 ${gpsStatus === 'active' ? 'opacity-90 grayscale-0' : 'opacity-40 grayscale mix-blend-luminosity'}`}
                        style={{ backgroundImage: `url('${mapUrl}')` }}
                    ></div>
                    <div className="absolute inset-0 bg-gradient-to-t from-forest-950 via-transparent to-transparent"></div>

                    {gpsStatus !== 'active' && (
                        <button
                            onClick={activateGPS}
                            disabled={gpsStatus === 'loading'}
                            className="z-10 text-center space-y-3 p-6 glass-card border-mint-500/40 transform scale-105 hover:scale-110 transition-transform cursor-pointer relative overflow-visible disabled:cursor-wait"
                        >
                            <div className="w-32 h-32 border-2 border-mint-500/30 rounded-full absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 animate-radar pointer-events-none"></div>
                            <div className="w-48 h-48 border border-mint-500/10 rounded-full absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 animate-radar pointer-events-none" style={{ animationDelay: '1s' }}></div>
                            <div className="relative w-12 h-12 bg-mint-500/20 rounded-full flex items-center justify-center mx-auto text-mint-400 animate-pulse shadow-[0_0_30px_rgba(17,212,66,0.4)]">
                                {gpsStatus === 'loading' ? (
                                    <div className="w-5 h-5 border-2 border-mint-400/30 border-t-mint-400 rounded-full animate-spin"></div>
                                ) : (
                                    <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clipRule="evenodd"></path></svg>
                                )}
                            </div>
                            <div>
                                <p className="text-white font-black text-sm uppercase tracking-widest">{gpsStatus === 'loading' ? 'Buscando...' : gpsStatus === 'error' ? 'Reintentar GPS' : 'Activar GPS'}</p>
                                <p className="text-[10px] text-mint-400 font-bold">Ver mapa en vivo</p>
                            </div>
                        </button>
                    )}

                    {gpsStatus === 'active' && (
                        <button
                            onClick={activateGPS}
                            className="absolute bottom-3 right-3 z-10 glass-card px-3 py-2 text-[10px] font-black uppercase tracking-widest text-mint-400 hover:bg-white/10 transition-colors"
                        >
                            🔄 Actualizar ubicación
                        </button>
                    )}
                </div>

                {/* Nearby Locations List */}
                <div className="space-y-4">
                    <div className="flex items-center justify-between pl-2 pr-1">
                        <h3 className="text-sm font-black text-white uppercase tracking-widest border-l-4 border-mint-500 pl-2 -ml-2">Puntos Cercanos</h3>
                        {nearbyPoints !== null && nearbyPoints.length > 0 && (
                            <span className="text-[9px] font-black text-mint-400 uppercase tracking-widest bg-mint-500/10 px-2 py-1 rounded-lg">📍 En vivo</span>
                        )}
                        {nearbyPoints !== null && nearbyPoints.length === 0 && !loadingPoints && (
                            <span className="text-[9px] font-black text-gray-500 uppercase tracking-widest">Sin resultados cercanos</span>
                        )}
                    </div>

                    {loadingPoints && (
                        <div className="glass-card p-6 flex items-center justify-center space-x-3 border-white/5">
                            <div className="w-4 h-4 border-2 border-mint-400/30 border-t-mint-400 rounded-full animate-spin"></div>
                            <span className="text-xs text-gray-400 font-medium">Buscando recursos reales cerca de ti...</span>
                        </div>
                    )}

                    {!loadingPoints && (
                        <div className="space-y-3">
                            {displayedPoints.map((point, i) => (
                                <div key={i} className="glass-card p-4 border border-white/5 hover:border-mint-500/30 transition-all cursor-pointer group flex items-center justify-between">
                                    <div className="flex items-center space-x-4">
                                        <div className={`w-12 h-12 rounded-2xl ${point.color} flex items-center justify-center text-2xl group-hover:scale-110 transition-transform`}>
                                            {point.icon}
                                        </div>
                                        <div>
                                            <h4 className="text-sm font-black text-white group-hover:text-mint-400 transition-colors">{point.label}</h4>
                                            <p className="text-xs text-gray-500 font-medium">{point.distanceLabel} · {point.sub}</p>
                                        </div>
                                    </div>
                                    <div className="text-right">
                                        {point.reward === 'Partner' ? (
                                            <span className="text-[10px] font-black text-orange-400 uppercase tracking-tight">Partner</span>
                                        ) : (

        const StatCard = ({ label, value, unit, icon, colorClass }) => (

                    <span className="text-gray-400 text-sm font-medium">{label}</span>

                    <span className="ml-1 text-sm text-gray-400">{unit}</span>

        // --- Pages ---

        const Login = ({ onLogin }) => {
            const toast = useToast();
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [name, setName] = useState('');
            const [isRegistering, setIsRegistering] = useState(false);
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);

                try {
                    if (isRegistering) {
                        const users = DB.getUsers();
                        if (users.find(u => u.email === email)) {
                            setError('El usuario ya existe');
                            setLoading(false);
                            return;
                        }
                        // Create Firebase Auth account
                        try {
                            await auth.createUserWithEmailAndPassword(email, password);
                        } catch (fbErr) {
                            console.log('Firebase Auth create fallback', fbErr.code);
                        }
                        await DB.saveUser({ email, password, name, role: 'user' });
                        setIsRegistering(false);
                        toast('¡Registro exitoso! Identifícate.', 'success');
                    } else {
                        const user = await DB.validateUser(email, password);
                        if (user) {
                            await onLogin(user);
                        } else {
                            setError('Credenciales incorrectas');
                        }
                    }
                } catch (err) {
                    setError('Error de conexión. Intenta de nuevo.');
                } finally {
                    setLoading(false);
                }
            };

            const handleGoogleSignIn = async () => {
                setError('');
                setLoading(true);
                try {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    const result = await auth.signInWithPopup(provider);
                    const fbUser = result.user;
                    const userEmail = fbUser.email;

                    // ¿Ya existe un perfil local para este email? (usuario que vuelve)
                    const users = DB.getUsers();
                    let userData = users.find(u => u.email === userEmail);

                    if (!userData) {
                        // Primera vez con Google: crear perfil base, igual que en el registro normal
                        userData = {
                            email: userEmail,
                            name: fbUser.displayName || userEmail.split('@')[0],
                            avatar: fbUser.photoURL || undefined,
                            role: 'user',
                            id: Date.now(),
                            regDate: new Date().toLocaleDateString(),
                            points: 100,
                            redeemed: [],
                            activities: [],
                            isVerified: false,
                            authProvider: 'google'
                        };
                        users.push(userData);
                        localStorage.setItem('hb_users', JSON.stringify(users));
                    }

                    await onLogin(userData);
                } catch (err) {
                    // El usuario cerro el popup o lo cancelo: no es un error real, no mostrar mensaje
                    if (err.code !== 'auth/popup-closed-by-user' && err.code !== 'auth/cancelled-popup-request') {
                        console.error('Google sign-in failed', err);
                        setError('No se pudo iniciar sesión con Google. Intenta de nuevo.');
                    }
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex flex-col justify-center px-6 py-12 animate-in fade-in duration-1000 max-w-md mx-auto">

                            <div className="absolute inset-0 bg-mint-500/20 blur-[50px] rounded-full animate-pulse-ring"></div>
                            <img src="logo.png" className="relative z-10 w-[200px] h-[200px] object-contain rounded-full animate-float drop-shadow-[0_0_40px_rgba(17,212,66,0.3)]" alt="Logo Happy Beat CL" />
                        </div>
                        <h1 className="text-4xl font-black mt-4 uppercase tracking-tighter">
                            Happy <span className="text-transparent bg-clip-text bg-gradient-to-r from-mint-400 to-emerald-300 shadow-sm">Beat</span> <span className="text-transparent bg-clip-text bg-gradient-to-r from-beatcoin to-yellow-200">CL</span>
                        </h1>
                        <p className="text-mint-500/80 text-xs font-bold tracking-widest uppercase mt-2">Rhythm for a Greener Tomorrow</p>
                    </div>

                    <div className="glass-card p-8 space-y-6 relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-32 h-32 bg-mint-500/10 blur-[60px] -z-10"></div>

                        <h2 className="text-2xl font-bold mb-2">{isRegistering ? 'Crea tu cuenta' : 'Bienvenido de nuevo'}</h2>

                        {error && <div className="bg-red-500/10 border border-red-500/50 text-red-500 text-xs p-3 rounded-xl mb-4">{error}</div>}

                        <form onSubmit={handleSubmit} className="space-y-4">
                            {isRegistering && (
                                <div className="space-y-2">
                                    <label className="text-xs font-bold uppercase tracking-widest text-gray-400 ml-1">Nombre</label>
                                    <input
                                        type="text"
                                        required
                                        className="w-full bg-white/5 border border-white/10 rounded-2xl py-4 px-6 focus:outline-none focus:border-mint-500/50 transition-all text-white"
                                        placeholder="Tu nombre completo"
                                        value={name}
                                        onChange={(e) => setName(e.target.value)}
                                    />
                                </div>
                            )}
                            <div className="space-y-2">
                                <label className="text-xs font-bold uppercase tracking-widest text-gray-400 ml-1">Email</label>
                                <input
                                    type="email"
                                    required
                                    className="w-full bg-white/5 border border-white/10 rounded-2xl py-4 px-6 focus:outline-none focus:border-mint-500/50 transition-all text-white"
                                    placeholder="hola@ejemplo.com"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                />
                            </div>

                            <div className="space-y-2">
                                <label className="text-xs font-bold uppercase tracking-widest text-gray-400 ml-1">Contraseña</label>
                                <input
                                    type="password"
                                    required
                                    className="w-full bg-white/5 border border-white/10 rounded-2xl py-4 px-6 focus:outline-none focus:border-mint-500/50 transition-all text-white"
                                    placeholder="••••••••"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                />
                            </div>

                            {!isRegistering && (
                                <div className="text-right">
                                    <button type="button" className="text-xs font-semibold text-mint-400 hover:text-mint-300">¿Olvidaste tu contraseña?</button>
                                </div>
                            )}

                            <button type="submit" disabled={loading} className="btn-primary w-full mt-4 flex items-center justify-center space-x-2 disabled:opacity-50">
                                {loading ? (
                                    <div className="w-5 h-5 border-2 border-forest-950/30 border-t-forest-950 rounded-full animate-spin"></div>
                                ) : (
                                    <>
                                        <span>{isRegistering ? 'Registrarse' : 'Iniciar Sesión'}</span>
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
                                    </>
                                )}
                            </button>
                        </form>

                        <div className="relative py-4">
                            <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-white/5"></div></div>
                            <div className="relative flex justify-center text-xs uppercase tracking-widest bg-none"><span className="px-2 text-gray-500 bg-[#05140b] backdrop-blur-sm">O continúa con</span></div>
                        </div>

                        <button
                            type="button"
                            onClick={handleGoogleSignIn}

                            <span className="text-xs font-bold">Continuar con Google</span>
                        </button>
                    </div>

                    <p className="text-center mt-8 text-sm text-gray-400">
                        {isRegistering ? '¿Ya tienes cuenta?' : '¿No tienes cuenta?'} {' '}
                        <button
                            onClick={() => setIsRegistering(!isRegistering)}
                            className="text-mint-400 font-bold hover:underline"
                        >
                            {isRegistering ? 'Inicia Sesión' : 'Regístrate aquí'}

                    </p>
                </div>
            );

        const MusicPlayer = () => {
            const [settings, setSettings] = useState(DB.getSettings());
            const [isExpanded, setIsExpanded] = useState(false);
            const [playState, setPlayState] = useState('idle'); // idle | loading | playing | paused | error
            const audioRef = React.useRef(null);

            useEffect(() => {
                const handleUpdate = () => setSettings(DB.getSettings());
                window.addEventListener('settingsUpdated', handleUpdate);
                return () => window.removeEventListener('settingsUpdated', handleUpdate);
            }, []);

            // Si cambia la URL de la señal (desde el Panel de Admin), reinicia
            // el reproductor para que cargue el stream nuevo.
            useEffect(() => {
                if (audioRef.current) {
                    audioRef.current.pause();
                    audioRef.current.load();
                }
                setPlayState('idle');
            }, [settings.streamUrl]);

            if (!settings.streamUrl) return null;

            const togglePlay = (e) => {
                e.stopPropagation();
                const audio = audioRef.current;
                if (!audio) return;
                if (playState === 'playing') {
                    audio.pause();
                    setPlayState('paused');
                } else {
                    setPlayState('loading');
                    audio.play().catch(() => setPlayState('error'));
                }
            };

            return (
                <div className="glass-card bg-forest-950/40 border border-white/5 overflow-hidden transition-all duration-300 hover:border-mint-500/20 shadow-lg">
                    {/* Elemento de audio real -- transmite la señal en vivo de Happy Harmony Radio */}
                    <audio
                        ref={audioRef}
                        src={settings.streamUrl}
                        preload="none"
                        onPlaying={() => setPlayState('playing')}
                        onWaiting={() => setPlayState('loading')}
                        onPause={() => setPlayState(p => p === 'error' ? p : 'paused')}
                        onError={() => setPlayState('error')}
                    />
                    <div
                        className="p-4 flex justify-between items-center cursor-pointer hover:bg-white/5 active:bg-white/10 transition-colors"
                        onClick={() => setIsExpanded(!isExpanded)}
                    >
                        <div className="flex items-center space-x-4">
                            <div className={`w-10 h-10 rounded-full overflow-hidden shadow-inner border border-mint-500/30 flex-shrink-0 ${playState === 'playing' ? 'animate-spin-slow' : ''}`}>
                                <img src="radio-logo.png" className="w-full h-full object-cover" alt="Logo Eternal Beat Radio" />
                            </div>
                            <div>
                                <h4 className="text-xs font-black uppercase text-mint-400 tracking-widest leading-none mb-1">Happy Harmony Radio</h4>
                                <p className="text-[9px] text-gray-400 font-medium">
                                    {playState === 'playing' ? '🔴 En Vivo' : playState === 'loading' ? 'Conectando...' : playState === 'error' ? 'Señal no disponible' : 'Mitigación Sostenible en Vivo'}
                                </p>
                            </div>
                        </div>
                        <div className="flex items-center space-x-3">
                            <div className={`flex space-x-1 items-end h-3 transition-opacity duration-500 ${playState === 'playing' ? 'opacity-100' : 'opacity-40'}`}>
                                <div className="w-0.5 h-2 bg-mint-500 animate-pulse"></div>
                                <div className="w-0.5 h-3 bg-mint-500 animate-pulse delay-75"></div>
                                <div className="w-0.5 h-1.5 bg-mint-500 animate-pulse delay-150"></div>
                            </div>
                            <div className="bg-white/5 p-1.5 rounded-lg border border-white/5">
                                <svg className={`w-4 h-4 text-gray-400 transition-transform duration-500 ${isExpanded ? 'rotate-180' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M19 9l-7 7-7-7"></path></svg>
                            </div>
                        </div>
                    </div>
                    {isExpanded && (
                        <div className="p-6 border-t border-white/5 animate-in slide-in-from-top duration-500 flex flex-col items-center space-y-4">
                            <div className={`w-28 h-28 rounded-full overflow-hidden border-2 border-mint-500/30 shadow-[0_0_25px_rgba(17,212,66,0.2)] ${playState === 'playing' ? 'animate-spin-slow' : ''}`}>
                                <img src="radio-logo.png" className="w-full h-full object-cover" alt="Logo Eternal Beat Radio" />
                            </div>
                            <button
                                onClick={togglePlay}
                                className={`w-16 h-16 rounded-full flex items-center justify-center shadow-[0_0_30px_rgba(17,212,66,0.3)] transition-all active:scale-95 ${playState === 'error' ? 'bg-red-500/20 border-2 border-red-500/40' : 'bg-mint-500'}`}
                            >
                                {playState === 'loading' ? (
                                    <div className="w-6 h-6 border-2 border-forest-950/30 border-t-forest-950 rounded-full animate-spin"></div>
                                ) : playState === 'playing' ? (
                                    <svg className="w-7 h-7 text-forest-950" fill="currentColor" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z" /></svg>
                                ) : playState === 'error' ? (
                                    <svg className="w-7 h-7 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01M5.07 19H19a2 2 0 001.75-2.97l-6.93-12a2 2 0 00-3.5 0l-6.93 12A2 2 0 005.07 19z" /></svg>
                                ) : (
                                    <svg className="w-7 h-7 text-forest-950" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
                                )}
                            </button>
                            <p className="text-[10px] text-gray-500 text-center">
                                {playState === 'error'
                                    ? 'No se pudo conectar con la señal en vivo. Intenta de nuevo más tarde.'
                                    : playState === 'playing'
                                    ? '🔴 Transmitiendo en vivo ahora'
                                    : 'Toca play para escuchar la señal en vivo'}
                            </p>
                        </div>
                    )}
                </div>
            );
        };

        const AIAssistant = () => {
            const user = React.useContext(UserContext);
            const [isOpen, setIsOpen] = useState(false);
            const [messages, setMessages] = useState([
                { role: 'assistant', content: `¡Hola ${user?.name || 'Eco-Guerrero'}! Soy tu Eco-IA. Estoy analizando tu impacto actual. ¿Quieres saber cómo mitigar más CO2 hoy?` }
            ]);
            const [input, setInput] = useState('');
            const [isTyping, setIsTyping] = useState(false);

            const handleSend = () => {
                if (!input.trim()) return;

                const userMsg = { role: 'user', content: input };
                setMessages(prev => [...prev, userMsg]);
                setInput('');
                setIsTyping(true);

                // Analyze User Data for personalization
                const activities = user?.activities || [];
                const totalSavings = activities.reduce((acc, curr) => acc + curr.savings, 0);
                const mainMode = activities.length > 0 ?
                    activities.reduce((a, b) => (activities.filter(v => v.mode === a).length >= activities.filter(v => v.mode === b).length ? a : b)).mode : 'ninguno';

                // Mock AI Logic with Personalization
                setTimeout(() => {
                    let response = "Es una excelente pregunta. Analizando tu perfil, veo que has ahorrado " + totalSavings.toFixed(1) + "kg de CO2. ";

                    const query = input.toLowerCase();
                    if (query.includes('mi') || query.includes('perfil') || query.includes('datos') || query.includes('historial')) {
                        response += `Tu modo principal es '${mainMode}'. Te sugiero diversificar tus actividades sostenibles para maximizar tus Beatcoins.`;
                    } else if (query.includes('transporte') || query.includes('auto') || query.includes('vuelo') || query.includes('viaje')) {
                        response = "En transporte, la mayor mitigación se logra usando bicicleta o transporte público. Si usas auto, intenta compartir viajes o planificar rutas eficientes para reducir emisiones por kilómetro.";
                    } else if (query.includes('carne') || query.includes('dieta') || query.includes('comida') || query.includes('alimento')) {
                        response = "Tu alimentación tiene un gran impacto. Reducir el consumo de carne roja y lácteos, y optar por productos locales y de temporada, puede bajar tu huella alimentaria significativamente.";
                    } else if (query.includes('luz') || query.includes('energía') || query.includes('electricidad') || query.includes('consumo')) {
                        response = "Para mitigar emisiones por energía, cambia a bombillas LED, desconecta aparatos en stand-by y considera instalar paneles solares. ¡Cada kWh ahorrado reduce emisiones directas!";
                    } else if (query.includes('basura') || query.includes('reciclar') || query.includes('plástico') || query.includes('residuo')) {
                        response = "La clave es 'Reducir'. Antes de reciclar, intenta evitar envases de un solo uso. Compostar tus residuos orgánicos evita la liberación de metano en vertederos.";
                    } else {
                        response = "Para mitigar tu huella de carbono de manera efectiva, te recomiendo priorizar la eficiencia en tus traslados y el cambio hacia una dieta más basada en plantas. ¡Sigue así!";
                    }

                    setMessages(prev => [...prev, { role: 'assistant', content: response }]);
                    setIsTyping(false);
                }, 1200);
            };

            return (
                <>
                    {/* Floating FAB */}
                    <div className="fixed bottom-28 right-6 z-50">
                        <button
                            onClick={() => setIsOpen(true)}
                            className="w-14 h-14 bg-mint-500 rounded-full flex items-center justify-center shadow-[0_8px_30px_rgba(17,212,66,0.4)] hover:scale-110 active:scale-95 transition-all group overflow-hidden"
                        >
                            <div className="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                            <div className="relative">
                                <span className="text-2xl drop-shadow-md">🤖</span>
                                <div className="absolute -top-1 -right-1 w-3 h-3 bg-blue-500 rounded-full border-2 border-mint-500 animate-pulse"></div>
                            </div>
                        </button>
                    </div>

                    {/* Chat Modal */}
                    {isOpen && (
                        <div className="fixed inset-0 z-[60] flex items-end sm:items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-in fade-in duration-300">
                            <div className="glass-card w-full max-w-md bg-forest-950 border border-white/10 flex flex-col h-[65vh] sm:h-[500px] overflow-hidden shadow-2xl animate-in zoom-in duration-300">
                                {/* Header */}
                                <div className="p-4 bg-white/5 border-b border-white/5 flex justify-between items-center">
                                    <div className="flex items-center space-x-3">
                                        <div className="w-10 h-10 bg-mint-500/20 rounded-full flex items-center justify-center text-xl shadow-inner">🤖</div>
                                        <div>
                                            <h3 className="font-bold text-sm">Eco-IA Asistente</h3>
                                            <div className="flex items-center space-x-1">
                                                <span className="w-1.5 h-1.5 bg-mint-500 rounded-full animate-pulse"></span>
                                                <span className="text-[9px] text-mint-500 uppercase font-black tracking-widest">Precisión Global</span>
                                            </div>
                                        </div>
                                    </div>
                                    <button onClick={() => setIsOpen(false)} className="p-2 hover:bg-white/5 rounded-full transition-colors text-gray-400 hover:text-white">
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                    </button>
                                </div>

                                {/* Messages Area */}
                                <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-black/20 custom-scrollbar">
                                    {messages.map((m, i) => (
                                        <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'} animate-in slide-in-from-bottom duration-300`}>
                                            <div className={`max-w-[85%] p-3.5 rounded-2xl text-xs leading-relaxed shadow-lg ${m.role === 'user'
                                                ? 'bg-gradient-to-br from-mint-500 to-mint-600 text-forest-950 font-bold rounded-tr-none'
                                                : 'bg-white/5 border border-white/10 text-gray-200 rounded-tl-none backdrop-blur-md'
                                                }`}>
                                                {m.content}
                                            </div>
                                        </div>
                                    ))}
                                    {isTyping && (
                                        <div className="flex justify-start animate-in fade-in">
                                            <div className="bg-white/5 border border-white/10 p-3 rounded-2xl rounded-tl-none flex space-x-1.5 backdrop-blur-md">
                                                <div className="w-1.5 h-1.5 bg-mint-500 rounded-full animate-bounce"></div>
                                                <div className="w-1.5 h-1.5 bg-mint-500 rounded-full animate-bounce [animation-delay:-0.15s]"></div>
                                                <div className="w-1.5 h-1.5 bg-mint-500 rounded-full animate-bounce [animation-delay:-0.3s]"></div>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {/* Input Area */}
                                <div className="p-4 bg-white/5 border-t border-white/5">
                                    <div className="flex space-x-2">
                                        <input
                                            type="text"
                                            value={input}
                                            onChange={(e) => setInput(e.target.value)}
                                            onKeyPress={(e) => e.key === 'Enter' && handleSend()}
                                            placeholder="Pregunta sobre mitigación de huella..."
                                            className="flex-1 bg-black/40 border border-white/10 rounded-2xl px-5 py-3.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-mint-500/50 transition-all shadow-inner"
                                        />

                            <div>
